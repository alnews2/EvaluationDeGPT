[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-de-gpt"
version = "0.3.0"
description = "Calculatrice quatre opérations - démonstrateur EvaluationDeGPT"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.9,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
