name: Windows build

on:
  push:
    branches:
      - "feature/**"
      - "feat/**"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest coverage ruff pyinstaller

      - name: Lint
        run: ruff check .

      - name: Tests with coverage
        run: python -m coverage run -m pytest

      - name: Coverage report
        run: python -m coverage report

      - name: Coverage HTML report
        run: python -m coverage html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: EvaluationDeGPT-coverage
          path: htmlcov/

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name EvaluationDeGPT src/evaluation_de_gpt/__main__.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: EvaluationDeGPT-windows
          path: dist/EvaluationDeGPT.exe
